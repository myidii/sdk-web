# Keeps a "Version packages" pull request open from the changesets on main. Merging it publishes the new
# versions to npm through trusted publishing (no token, with provenance) and tags them on GitHub.
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs a recent npm
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      # Nothing is published unless the unit and packaging tests pass on this exact commit.
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:packaging -- --skip-build
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npx changeset publish
          commit: Version packages
          title: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
