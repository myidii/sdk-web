<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kora Bank · open an account</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4F1EA;font-family:system-ui,sans-serif;color:#1d1b16}
main{width:min(420px,92vw);background:#fff;border-radius:18px;padding:32px;box-shadow:0 20px 50px -20px rgba(0,0,0,.2)}
h1{margin:0 0 6px;font-size:24px}p{color:#6b6458;margin:0 0 20px}
button{width:100%;height:48px;border:0;border-radius:12px;background:#1E5631;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
button.alt{background:#efe9dc;color:#1d1b16}
pre{background:#f6f3ec;border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;min-height:40px}
</style></head>
<body><main>
<h1>Open your Kora account</h1>
<p>One last step: a quick face check to confirm it's really you.</p>
<button id="go">Verify it's me</button>
<button id="fail" class="alt">Try a failing check (sandbox)</button>
<h3>What the page heard</h3><pre id="hint">Nothing yet</pre>
<h3>What our server confirmed</h3><pre id="server">Nothing yet</pre>
<h3>Webhooks our server received</h3><pre id="hooks">Nothing yet</pre>
</main>
<script type="module">
import { Myidii } from "/sdk/index.js";
const $ = (id) => document.getElementById(id);
async function run(simulate) {
  const { id, url } = await fetch("/api/start", { method: "POST", body: JSON.stringify({ simulate }) }).then((r) => r.json());
  const result = await Myidii.startLiveness({ url });
  $("hint").textContent = JSON.stringify(result, null, 2);
  const verdict = await fetch(`/api/result?id=${id}`).then((r) => r.json());
  $("server").textContent = JSON.stringify({ id: verdict.id, status: verdict.status, score: verdict.score }, null, 2);
  setTimeout(async () => { $("hooks").textContent = JSON.stringify(await fetch("/api/webhooks").then((r) => r.json()), null, 2); }, 2500);
}
$("go").onclick = () => run();
$("fail").onclick = () => run("fail");
</script>
</body></html>
