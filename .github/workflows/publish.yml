# Publishes @myidii/web to npm when a GitHub release is published (tag v<version>, matching package.json).
# No npm token: npm trusts this workflow (trusted publishing), and each release carries a provenance record.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs a recent npm
        run: npm install -g npm@latest
      - name: Tag must match the package version
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
