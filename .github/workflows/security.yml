name: Security

# Secret scanning, dependency checks and CodeQL.
#   gitleaks           every push and pull request. Full history on main; only the new commits elsewhere.
#                      Findings are redacted in the log. To mark a finding as a false positive, add its
#                      fingerprint (printed with each finding) to .gitleaksignore at the repo root.
#   dependency review  pull requests: fails on new high or critical advisories in runtime dependencies.
#   npm audit          full report in the job summary; fails only on high or critical in production deps.
#   CodeQL             JavaScript and TypeScript, on main, pull requests and weekly. Public repo, so it's free.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The binary, not gitleaks-action: the action needs a paid licence for organisation repos.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"                 # the commits in this pull request
          elif [ "$REF" = refs/heads/main ] || [ "$EVENT" != push ]; then
            range="HEAD"                                  # all of main's history
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"                         # what this push added
          elif git rev-parse -q --verify origin/main >/dev/null; then
            range="origin/main..HEAD"                     # a new branch: what it adds to main
          else
            range="HEAD"
          fi
          echo "Scanning $range"
          gitleaks git . --redact --no-banner --log-opts="--full-history $range"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # npm audit reads package-lock.json; nothing is installed.
      - name: Report (all dependencies)
        run: |
          {
            echo "### npm audit, all dependencies"
            echo '```'
            npm audit --audit-level=low || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail on high or critical in production dependencies
        run: npm audit --omit=dev --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
